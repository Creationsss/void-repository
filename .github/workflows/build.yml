name: Build and publish XBPS packages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            clusters: ${{ steps.clusters.outputs.clusters }}
            build_only: ${{ steps.filter.outputs.build_only }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Detect build filter
              id: filter
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  EVENT: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set_out() { echo "build_only=$1" >> "$GITHUB_OUTPUT"; }

                  # Pull requests: build-verify only the packages the PR changes.
                  if [ "$EVENT" = "pull_request" ]; then
                    changed="$(git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null \
                      | sed -n 's#^srcpkgs/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ' | xargs)"
                    if [ -n "$changed" ]; then
                      set_out "$changed"; echo ":: PR check builds changed packages: $changed"
                    else
                      set_out "__none__"; echo ":: PR changes no packages; nothing to build"
                    fi
                    exit 0
                  fi

                  # push / manual: tokens from commit-message brackets.
                  raw="$(printf '%s' "$COMMIT_MSG" | grep -oE '\[[^]]+\]' | sed 's/\[//;s/\]//' \
                    | grep -viE '^(skip ci|ci skip|no ci|skip actions|actions skip)$')"

                  # Full rebuild is opt-in only via [full rebuild] / [full-rebuild].
                  if printf '%s\n' "$raw" | grep -qiE '^full[ -]rebuild$'; then
                    set_out "__all__"; echo ":: Full rebuild requested"
                    exit 0
                  fi

                  if [ -z "$raw" ]; then
                    set_out "__none__"
                    echo ":: no package tokens and no [full rebuild] — nothing to build"
                    exit 0
                  fi
                  valid=""
                  for tok in $raw; do
                    [ -d "srcpkgs/$tok" ] && valid="$valid $tok"
                  done
                  valid="$(echo "$valid" | xargs)"
                  if [ -n "$valid" ]; then
                    set_out "$valid"; echo ":: Filter: $valid"
                  else
                    set_out "__none__"
                    echo "::warning::brackets present but none match a srcpkgs dir — nothing to build"
                  fi

            - name: Build cluster manifest
              id: clusters
              env:
                  FILTER: ${{ steps.filter.outputs.build_only }}
              run: |
                  groups='umu-launcher faugus-launcher;websocketpp obs-ws'
                  isolated="umu-launcher faugus-launcher"
                  main=""
                  for d in srcpkgs/*/; do
                    [ -L "${d%/}" ] && continue
                    name="$(basename "$d")"
                    case " $isolated " in
                      *" $name "*) ;;
                      *) main="$main $name" ;;
                    esac
                  done
                  main="$(echo "$main" | xargs)"
                  isolated="$(echo "$isolated" | xargs)"
                  if [ "$FILTER" = "__all__" ]; then
                    : # build everything — keep the full isolated/main lists
                  elif [ -z "$FILTER" ] || [ "$FILTER" = "__none__" ]; then
                    isolated=""; main=""
                  else
                    sel=" $FILTER "
                    oldIFS=$IFS; IFS=';'
                    for g in $groups; do
                      IFS=$oldIFS
                      ghit=0; for m in $g; do case "$sel" in *" $m "*) ghit=1 ;; esac; done
                      if [ "$ghit" -eq 1 ]; then
                        for m in $g; do case "$sel" in *" $m "*) ;; *) sel="$sel$m " ;; esac; done
                      fi
                      IFS=';'
                    done
                    IFS=$oldIFS
                    new=""; for p in $isolated; do case "$sel" in *" $p "*) new="$new $p" ;; esac; done
                    isolated="$(echo "$new" | xargs)"
                    new=""; for p in $main; do case "$sel" in *" $p "*) new="$new $p" ;; esac; done
                    main="$(echo "$new" | xargs)"
                  fi
                  json="["; sep=""
                  [ -n "$isolated" ] && { json="${json}${sep}{\"name\":\"isolated\",\"pkgs\":\"$isolated\"}"; sep=","; }
                  [ -n "$main" ] && { json="${json}${sep}{\"name\":\"main\",\"pkgs\":\"$main\"}"; sep=","; }
                  json="${json}]"
                  echo "clusters=$json" >> "$GITHUB_OUTPUT"
                  echo ":: Matrix: $json"

    build:
        needs: discover
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/void-linux/void-glibc-full:latest
            options: --privileged
        strategy:
            fail-fast: false
            matrix:
                cluster: ${{ fromJson(needs.discover.outputs.clusters) }}
        env:
            BUILD_ONLY: ${{ needs.discover.outputs.build_only }}
            CLUSTER_PKGS: ${{ matrix.cluster.pkgs }}
        steps:
            - name: Install dependencies
              run: |
                  xbps-install -Syu -y
                  xbps-install -y git xbps xtools base-devel curl unzip void-repo-multilib
                  xbps-install -Sy -y gcc-multilib glibc-devel-32bit vulkan-loader-devel-32bit \
                    MesaLib-devel-32bit libX11-devel-32bit libxcb-devel-32bit wayland-devel-32bit

            - name: Install bun
              env:
                  BUN_INSTALL: /usr/local
              run: |
                  curl -fsSL https://bun.sh/install | bash

            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Clone void-packages
              run: |
                  git clone --depth 1 https://github.com/void-linux/void-packages /void-packages

            - name: Copy srcpkgs into void-packages
              run: |
                  for pkg in srcpkgs/*/; do
                    pkgname="$(basename "$pkg")"
                    if [ -L "${pkg%/}" ]; then
                      target="$(readlink "${pkg%/}")"
                      ln -sf "$target" "/void-packages/srcpkgs/$pkgname"
                      echo ":: Linked $pkgname -> $target"
                    else
                      cp -rT "$pkg" "/void-packages/srcpkgs/$pkgname"
                      echo ":: Copied $pkgname"
                    fi
                  done

            - name: Apply shlibs overrides
              run: |
                  SHLIBS=/void-packages/common/shlibs
                  for f in extra/shlibs_remove extra/shlibs_append; do
                    [ -f "$f" ] || continue
                    while read -r so _; do
                      [ -n "$so" ] || continue
                      case "$so" in \#*) continue ;; esac
                      sed -i "\\|^${so} |d" "$SHLIBS"
                    done < "$f"
                  done
                  [ -f extra/shlibs_append ] && cat extra/shlibs_append >> "$SHLIBS"
                  echo ":: applied shlibs overrides"

            - name: Bootstrap xbps-src
              run: |
                  cd /void-packages
                  echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
                  ./xbps-src binary-bootstrap
                  cp /usr/local/bin/bun masterdir-x86_64/usr/bin/bun

            - name: Restore package cache
              uses: actions/cache/restore@v6
              with:
                  path: /void-packages/hostdir/binpkgs
                  key: xbps-pkgs-v3-${{ github.run_id }}
                  restore-keys: xbps-pkgs-v3-

            - name: Clean stale repodata
              run: rm -f /void-packages/hostdir/binpkgs/*-repodata* /void-packages/hostdir/binpkgs/*-stagedata* /void-packages/hostdir/binpkgs/*.plist

            - name: Build cluster
              env:
                  CLUSTER_NAME: ${{ matrix.cluster.name }}
              run: sh "$GITHUB_WORKSPACE/.github/scripts/build-cluster.sh"

            - name: Upload cluster artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: cluster-${{ matrix.cluster.name }}
                  path: /tmp/built-xbps/
                  if-no-files-found: ignore
                  retention-days: 7

    assemble:
        needs: build
        if: ${{ github.event_name == 'push' && success() }}
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/void-linux/void-glibc-full:latest
        steps:
            - name: Install dependencies
              run: xbps-install -Syu -y && xbps-install -y xbps xtools aws-cli curl jq

            - uses: actions/checkout@v5

            - name: Prepare binpkgs workspace
              run: mkdir -p /void-packages/hostdir/binpkgs

            - name: Restore previous binpkg cache
              uses: actions/cache/restore@v6
              with:
                  path: /void-packages/hostdir/binpkgs
                  key: xbps-pkgs-v3-${{ github.run_id }}
                  restore-keys: xbps-pkgs-v3-

            - name: Clean stale repodata
              run: rm -f /void-packages/hostdir/binpkgs/*-repodata* /void-packages/hostdir/binpkgs/*-stagedata* /void-packages/hostdir/binpkgs/*.plist

            - name: Download cluster artifacts
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/cluster-artifacts
                  pattern: cluster-*
                  merge-multiple: true

            - name: Stage new .xbps into binpkgs
              run: |
                  if [ -d /tmp/cluster-artifacts ] && [ -n "$(ls -A /tmp/cluster-artifacts 2>/dev/null)" ]; then
                    cp -fv /tmp/cluster-artifacts/*.xbps /void-packages/hostdir/binpkgs/
                  else
                    echo ":: No fresh cluster artifacts — assembling from cache only"
                  fi

            - name: Remove cached packages no longer in srcpkgs
              run: sh "$GITHUB_WORKSPACE/.github/scripts/stale-cleanup.sh"

            - name: Sign and index repository
              env:
                  XBPS_SIGNING_KEY: ${{ secrets.XBPS_SIGNING_KEY }}
              run: |
                  trap 'rm -f /tmp/keys/private.pem' EXIT
                  mkdir -p /tmp/keys
                  ( umask 077 && printf '%s\n' "$XBPS_SIGNING_KEY" > /tmp/keys/private.pem )
                  cd /void-packages/hostdir/binpkgs
                  set -- *.xbps
                  if [ ! -e "$1" ]; then
                    echo "::warning::No .xbps files to publish; skipping signing"
                    exit 0
                  fi
                  xbps-rindex -a "$@"
                  xbps-rindex --remove-obsoletes .
                  xbps-rindex --clean .
                  xbps-rindex --privkey /tmp/keys/private.pem --sign --signedby "Creations Void Repo" .
                  set -- *.xbps
                  find . -maxdepth 1 -name '*.xbps.sig2' -delete
                  xbps-rindex --privkey /tmp/keys/private.pem --sign-pkg "$@"
                  cp "$GITHUB_WORKSPACE/repo-signing-key.pem" .

            - name: Save package cache
              if: success()
              uses: actions/cache/save@v6
              with:
                  path: /void-packages/hostdir/binpkgs
                  key: xbps-pkgs-v3-${{ github.run_id }}

            - name: Resolve latest upstream versions
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  OUT: /void-packages/hostdir/binpkgs/versions.json
              run: sh "$GITHUB_WORKSPACE/.github/scripts/gen-versions.sh"

            - name: Prepare site
              env:
                  VERSIONS: /void-packages/hostdir/binpkgs/versions.json
              run: sh "$GITHUB_WORKSPACE/.github/scripts/prepare-site.sh"

            - name: Upload to R2
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto
                  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
              run: |
                  cd /void-packages/hostdir/binpkgs
                  aws s3 sync . s3://void-repo/ --endpoint-url "$R2_ENDPOINT_URL"
                  # phase 2: prune remote-only keys (real deletions of
                  # packages we no longer have locally)
                  aws s3 ls s3://void-repo/ --endpoint-url "$R2_ENDPOINT_URL" \
                    | awk 'NF>=4 {print $NF}' \
                    | while IFS= read -r key; do
                        [ -e "./$key" ] || aws s3 rm "s3://void-repo/$key" \
                          --endpoint-url "$R2_ENDPOINT_URL"
                      done

    notify-failure:
        needs: [discover, build, assemble]
        if: ${{ github.event_name == 'push' && failure() }}
        runs-on: ubuntu-latest
        steps:
            - name: Open issue on build failure
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SHA: ${{ github.sha }}
              run: |
                  title="build failed: ${SHA}"
                  count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                    --search "$title in:title" --json title --jq 'length' 2>/dev/null || echo 0)"
                  if [ "${count:-0}" -gt 0 ]; then
                    echo "issue already open for $SHA"
                    exit 0
                  fi
                  gh issue create --repo "$GITHUB_REPOSITORY" \
                    --title "$title" \
                    --body "The build/publish workflow failed for commit ${SHA}. Nothing was published to R2. Run: ${RUN_URL}"
